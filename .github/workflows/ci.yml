# Prüft jeden Push und jeden Pull Request: Typen, Lint und Tests.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Die Tests nutzen das in Node eingebaute SQLite (node:sqlite).
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Typen prüfen
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Tests
        run: npm test
